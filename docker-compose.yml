services:
  postgres:
    image: postgres:15-alpine
    container_name: fraud_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_detection}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - fraud_net

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command: mlflow ui --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - fraud_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - mlflow
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/fraud_detection}
    networks:
      - fraud_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/fraud_detection}
    depends_on:
      - api
    networks:
      - fraud_net

volumes:
  postgres_data:

networks:
  fraud_net: